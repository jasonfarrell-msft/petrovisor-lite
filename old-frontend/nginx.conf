server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: let client-side router (react-router) handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html is not cached so deploys
    # take effect immediately for the SPA shell.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
