services:
  petrovisor-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: petrovisor-lite-sql
    environment:
      ACCEPT_EULA: "Y"
      # DEV-ONLY password for the local SQL Server container. Never used in production —
      # set your own value via an environment variable if you don't like the default, e.g.:
      #   MSSQL_SA_PASSWORD="Your$trongPassw0rd" docker compose up -d
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DevOnly!Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - petrovisor-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  petrovisor-sql-data:

# Dev-only SQL Server for the PetroVisorLite backend (see /backend). This is NOT part of
# the application's own container topology (Lando owns app Dockerfiles / infra in /infra) —
# it exists purely so backend devs have a local SQL Server without installing it natively.
#
# Usage:
#   docker compose up -d
#   dotnet user-secrets set "ConnectionStrings:PetroVisorDb" \
#     "Server=localhost,1433;Database=PetroVisorLite;User Id=sa;Password=DevOnly!Passw0rd;TrustServerCertificate=True" \
#     --project backend/src/PetroVisorLite.Api
#   dotnet ef database update --project backend/src/PetroVisorLite.Infrastructure --startup-project backend/src/PetroVisorLite.Api
