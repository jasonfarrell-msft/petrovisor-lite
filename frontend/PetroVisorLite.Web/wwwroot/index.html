<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetroVisor Lite</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <!-- Bootstrap via CDN — no npm/node build step, per the frontend pivot decisions. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Chart.js via CDN <script> tag (no npm package) — used from wwwroot/js/chartInterop.js
         via JS interop from Blazor components. -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <!-- Branded boot splash: shown while the WASM runtime downloads (0-100%) and while
             Blazor finishes JIT/interpreter startup after the download completes. Blazor
             replaces this markup with the routed page the moment the first component renders,
             so keeping the same visual language here as Dashboard's own loading state (same
             spinner style, same "PetroVisor Lite" branding) avoids the jarring "loads to 100%
             then a different loading screen appears" perception bug. -->
        <div class="app-boot-splash">
            <div class="app-boot-brand">PetroVisor Lite</div>
            <svg class="loading-progress">
                <circle r="40%" cx="50%" cy="50%" />
                <circle r="40%" cx="50%" cy="50%" />
            </svg>
            <div class="loading-progress-text"></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
